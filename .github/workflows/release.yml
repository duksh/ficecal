name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        type: string
      target:
        description: "Branch or commit SHA to release from"
        required: true
        default: "main"
        type: string
      title:
        description: "Release title (optional)"
        required: false
        type: string
      notes:
        description: "Optional release notes body (markdown)"
        required: false
        type: string
      draft:
        description: "Create as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# Opt into Node.js 24 runner for all actions (deprecation of Node.js 20, effective June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: '${{ inputs.version }}'"
            exit 1
          fi

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ inputs.version }}"
            exit 1
          fi

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          release_name="${{ inputs.title }}"
          if [[ -z "$release_name" ]]; then
            release_name="${{ inputs.version }}"
          fi
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

          if [[ -n "${{ inputs.notes }}" ]]; then
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run billing live smoke gate
        shell: bash
        env:
          BILLING_LIVE_SMOKE_MODE: live
          FICECAL_OPENOPS_CREDENTIAL_REF: ${{ secrets['FICECAL_OPENOPS_CREDENTIAL_REF'] }}
          FICECAL_AWS_CREDENTIAL_REF: ${{ secrets['FICECAL_AWS_CREDENTIAL_REF'] }}
          FICECAL_AZURE_CREDENTIAL_REF: ${{ secrets['FICECAL_AZURE_CREDENTIAL_REF'] }}
          FICECAL_GCP_CREDENTIAL_REF: ${{ secrets['FICECAL_GCP_CREDENTIAL_REF'] }}
          FICECAL_OPENOPS_LIVE_SMOKE_CMD: ${{ secrets['FICECAL_OPENOPS_LIVE_SMOKE_CMD'] }}
          FICECAL_AWS_LIVE_SMOKE_CMD: ${{ secrets['FICECAL_AWS_LIVE_SMOKE_CMD'] }}
          FICECAL_AZURE_LIVE_SMOKE_CMD: ${{ secrets['FICECAL_AZURE_LIVE_SMOKE_CMD'] }}
          FICECAL_GCP_LIVE_SMOKE_CMD: ${{ secrets['FICECAL_GCP_LIVE_SMOKE_CMD'] }}
        run: |
          python3 scripts/run-billing-live-smoke.py --mode live --require-provider-commands

      - name: Billing live reconciliation gate
        shell: bash
        run: |
          python3 scripts/validate-billing-live-reconciliation.py

      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.target }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ steps.meta.outputs.generate_notes == 'true' }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
