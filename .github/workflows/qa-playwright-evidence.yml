name: QA Playwright Evidence

on:
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - ".github/workflows/qa-playwright-evidence.yml"
  pull_request:
    paths:
      - "apps/web/**"
  workflow_dispatch:

permissions:
  contents: read

# Opt into Node.js 24 runner for all actions (deprecation of Node.js 20, effective June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  playwright-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack and install dependencies
        shell: bash
        working-directory: .
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web app
        shell: bash
        run: pnpm build

      - name: Install Playwright browsers
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run Playwright evidence suite
        id: run_playwright
        shell: bash
        run: |
          set +e
          mkdir -p tests/evidence/playwright/{screenshots,videos,traces}
          mkdir -p tests/evidence/reports/{html,junit}
          mkdir -p tests/evidence/logs/ci

          pnpm test:playwright 2>&1 | tee tests/evidence/logs/ci/playwright-run.log
          exit_code=${PIPESTATUS[0]}

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect Playwright outputs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d playwright-report ]; then
            cp -R playwright-report/. tests/evidence/reports/html/
          fi
          if [ -d test-results ]; then
            cp -R test-results/. tests/evidence/playwright/traces/
          fi

      - name: Upload QA evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            apps/web/tests/evidence/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce pass gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.run_playwright.outputs.exit_code }}" != "0" ]; then
            echo "Playwright tests failed. See uploaded QA evidence artifacts."
            exit 1
          fi

      - name: Write QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## QA Playwright Evidence"
            echo "- Suite: apps/web/e2e/smoke.spec.ts"
            echo "- Exit code: ${{ steps.run_playwright.outputs.exit_code }}"
            echo "- Artifacts: playwright-evidence-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
